name: Builds of Tests/Examples

on:
  push:
    branches:
      - latest
      - stable

  pull_request:
    branches:
      - latest
      - stable

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug]
        c_compiler: [gcc, clang, cl]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Update/Install Packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install xorg-dev libasound2-dev

      - name: Install GLFW (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $glfwVersion = "3.4"
          Invoke-WebRequest -Uri "https://github.com/glfw/glfw/releases/download/$glfwVersion/glfw-$glfwVersion.bin.WIN64.zip" -OutFile "glfw.zip"
          Expand-Archive -Path "glfw.zip" -DestinationPath "C:\glfw"

          $libDir = if ("${{ matrix.c_compiler }}" -eq "cl") { "lib-vc2022" } else { "lib-mingw-w64" }

          echo "CGO_CFLAGS=-IC:\glfw\include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:\glfw\$libDir" >> $env:GITHUB_ENV

      - name: Go tidy
        run: go mod tidy

      - name: Build tests
        run: make tests

  examples:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug]
        c_compiler: [gcc, clang, cl]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Update/Install Packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install xorg-dev libasound2-dev

      - name: Install GLFW (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $glfwVersion = "3.4"
          Invoke-WebRequest -Uri "https://github.com/glfw/glfw/releases/download/$glfwVersion/glfw-$glfwVersion.bin.WIN64.zip" -OutFile "glfw.zip"
          Expand-Archive -Path "glfw.zip" -DestinationPath "C:\glfw"

          $libDir = if ("${{ matrix.c_compiler }}" -eq "cl") { "lib-vc2022" } else { "lib-mingw-w64" }

          echo "CGO_CFLAGS=-IC:\glfw\include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:\glfw\$libDir" >> $env:GITHUB_ENV

      - name: Go tidy
        run: go mod tidy

      - name: Build examples
        run: make examples
