name: Builds of Tests/Examples

on:
  push:
    branches:
      - latest
      - stable

  pull_request:
    branches:
      - latest
      - stable

permissions:
  contents: read
  pull-requests: write

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug]
        c_compiler: [gcc, clang, cl]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Update/Install Packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libasound2-dev

      - name: Install GLFW (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $glfwVersion = "3.4"
          Invoke-WebRequest -Uri "https://github.com/glfw/glfw/releases/download/$glfwVersion/glfw-$glfwVersion.bin.WIN64.zip" -OutFile "glfw.zip"
          Expand-Archive -Path "glfw.zip" -DestinationPath "C:\glfw"

          $libDir = if ("${{ matrix.c_compiler }}" -eq "cl") { "lib-vc2022" } else { "lib-mingw-w64" }

          echo "CGO_CFLAGS=-IC:\glfw\include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:\glfw\$libDir" >> $env:GITHUB_ENV

      - name: Go tidy
        run: go mod tidy

      - name: Build tests
        run: make tests

  tests-bsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bsd: [freebsd, netbsd, openbsd]
    steps:
      - uses: actions/checkout@v3

      - name: Run Tests on FreeBSD
        if: matrix.bsd == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y git go cmake gmake glfw pkgconf openal-soft
          run: |
            export GOFLAGS="-buildvcs=false"
            go mod tidy
            gmake tests

      - name: Run Tests on NetBSD
        if: matrix.bsd == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          prepare: |
            pkgin -y install git go cmake gmake glfw pkgconf openal-soft
          run: |
            export GOFLAGS="-buildvcs=false"
            go mod tidy
            gmake tests

      - name: Run Tests on OpenBSD
        if: matrix.bsd == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          prepare: |
            pkg_add git go cmake gmake glfw pkgconf openal
          run: |
            export GOFLAGS="-buildvcs=false"
            go mod tidy
            gmake tests

  examples:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug]
        c_compiler: [gcc, clang, cl]
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Update/Install Packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libasound2-dev

      - name: Install GLFW (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $glfwVersion = "3.4"
          Invoke-WebRequest -Uri "https://github.com/glfw/glfw/releases/download/$glfwVersion/glfw-$glfwVersion.bin.WIN64.zip" -OutFile "glfw.zip"
          Expand-Archive -Path "glfw.zip" -DestinationPath "C:\glfw"

          $libDir = if ("${{ matrix.c_compiler }}" -eq "cl") { "lib-vc2022" } else { "lib-mingw-w64" }

          echo "CGO_CFLAGS=-IC:\glfw\include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:\glfw\$libDir" >> $env:GITHUB_ENV

      - name: Go tidy
        run: go mod tidy

      - name: Build examples
        run: make examples

  examples-bsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bsd: [freebsd, netbsd, openbsd]
    steps:
      - uses: actions/checkout@v3

      - name: Build Examples on FreeBSD
        if: matrix.bsd == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y git go cmake gmake glfw pkgconf openal-soft
          run: |
            export GOFLAGS="-buildvcs=false"
            go mod tidy
            gmake examples

      - name: Build Examples on NetBSD
        if: matrix.bsd == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          prepare: |
            pkgin -y install git go cmake gmake glfw pkgconf openal-soft
          run: |
            export GOFLAGS="-buildvcs=false"
            go mod tidy
            gmake examples

      - name: Build Examples on OpenBSD
        if: matrix.bsd == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          prepare: |
            pkg_add git go cmake gmake glfw pkgconf openal
          run: |
            export GOFLAGS="-buildvcs=false"
            go mod tidy
            gmake examples
