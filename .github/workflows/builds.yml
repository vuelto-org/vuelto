name: Builds of Tests/Examples

on:
  push:
    branches:
      - latest
      - stable

  pull_request:
    branches:
      - latest
      - stable

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug]
        c_compiler: [gcc, clang, cl]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Update/Install Packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install xorg-dev libasound2-dev

      - name: Go tidy
        run: go mod tidy

      - name: Build tests
        run: make tests

  examples:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug]
        c_compiler: [gcc, clang, cl]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Update/Install Packages (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install xorg-dev libasound2-dev

      - name: Go tidy
        run: go mod tidy

      - name: Build examples
        run: make examples
